<script>
'use strict';
const el=id=>document.getElementById(id);
const simple='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
function numberToSlug(n){return n<20?simple[n]:['twenty','thirty','forty','fifty'][Math.floor(n/10)-2]+(n%10?'-'+simple[n%10]:'')}
async function loadImage(src){const img=new Image();img.src=src;await img.decode();return img}
const sequence=(n,fn)=>Promise.all(Array.from({length:n},(_,i)=>fn(i)));
const wrap=(n,m)=>(n%m+m)%m;
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
let backgrounds,words,yellowWords,ready=false,time=0,previous=-1,saved=0,start=null,drag=null,audio,animationId=0;
let lastTickTime=-Infinity;
const duration=33.2;
const hintUntil=2.15,introLength=5.1,staticMusicTurn=5.6;
const counterStart=7.76,counterEnd=9.35,counterExtra=counterEnd-counterStart;
// Cut the source immediately after its strong woodblock strike at 15.52 seconds.
const percussionCut=15.60;
const wheelTickFade=1.2;
let leadIn=0,onboarding=true,listOpening=false,addedAlarm=null;
const alarms=[
 {time:1418,days:[0],enabled:true},
 {time:515,days:[0,1,2,3,4],enabled:false},
 {time:1020,days:[],enabled:true}
];
function renderAlarms(){
 const entries=addedAlarm===null?alarms:[addedAlarm,...alarms];
 el('list-cards').replaceChildren(...entries.map(alarm=>{
  const {time,days}=alarm;
  const h=Math.floor(time/60),m=time%60,angle=(time%720)*Math.PI/360;
  const card=document.createElement('article');card.className='alarm-row';
  card.innerHTML='<div class="alarm-art"><i></i></div><div class="alarm-name">'+numberToSlug(h)+' <small>hrs</small><br>'+numberToSlug(m)+' <small>min</small></div><button type="button" class="alarm-switch" role="switch" aria-label="Будильник '+numberToSlug(h)+' '+numberToSlug(m)+'"></button><div class="alarm-days" role="group" aria-label="Дни недели"></div>';
  card.firstElementChild.style.backgroundImage='url("'+backgrounds[h].src+'")';
  Object.assign(card.querySelector('i').style,{left:(50+49*Math.sin(angle))+'%',top:(50-49*Math.cos(angle))+'%'});
  const control=card.querySelector('.alarm-switch'),dayRow=card.querySelector('.alarm-days');
  function updateSwitch(){
   control.setAttribute('aria-checked',alarm.enabled);
   card.classList.toggle('is-off',!alarm.enabled);
   dayRow.hidden=!alarm.enabled;
  }
  control.onclick=()=>{
   alarm.enabled=!alarm.enabled;
   updateSwitch();
   unlock();tone(alarm.enabled?430:310,.055,.065);
  };
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((day,i)=>{
   const button=document.createElement('button');
   button.type='button';
   button.textContent=day;
   button.setAttribute('aria-pressed',days.includes(i));
   button.onclick=()=>{
    if(!alarm.enabled)return;
    const selected=days.indexOf(i);
    if(selected<0)days.push(i);else days.splice(selected,1);
    button.setAttribute('aria-pressed',selected<0);
    unlock();tone(selected<0?550:395,.047,.055);
   };
   dayRow.append(button);
  });
  updateSwitch();
  return card;
 }));
}
function paintList(opacity,press=0){
 const list=el('alarm-list');
 list.style.setProperty('--list-scale',fit());
 list.style.opacity=opacity;
 list.style.pointerEvents=opacity>.95?'auto':'none';
 list.inert=opacity<.95;
 const add=el('add-alarm');
 add.style.transform='scale('+(1-.16*press)+')';
 add.style.backgroundColor='rgba(255,255,255,'+(.2*press)+')';
}
function saveListAlarm(value){
 if(addedAlarm?.time===value)return;
 addedAlarm={time:value,days:[],enabled:true};
 renderAlarms();
}
el('add-alarm').onclick=()=>{
 if(!ready||listOpening||start!==null)return;
 listOpening=true;
 unlock();tone(530,.06,.07);
 let began;
 function animate(now){
  if(!listOpening)return;
  began??=now;
  const t=(now-began)/1000;
  paintList(1-cubicPhase(t,.13,.30),cubicPhase(t,0,.09)*(1-cubicPhase(t,.09,.28)));
  reveal('phone',cubicPhase(t,.30,.49));
  if(t<.49)requestAnimationFrame(animate);
  else{listOpening=false;onboarding=true;showWheelHint(true);setIdleGlow(true);el('dial').focus({preventScroll:true})}
 }
 requestAnimationFrame(animate);
};
const reelElapsed=now=>wrap((now-start)/1000,duration+leadIn+staticMusicTurn+counterExtra);
function showWheelHint(visible){
 el('wheel-hint').classList.toggle('visible',visible);
 const dial=el('dial');
 if(visible)dial.setAttribute('aria-description','Rotate the circle to set the time');
 else dial.removeAttribute('aria-description');
}
const impactAt=23.5,vibrationAt=24.5,vibrationEnd=26.65;
const ringAt=vibrationEnd+.7,autoSlide=ringAt+3.2,returnAt=ringAt+3.85;
const spinAt=2,wordHandoffAt=10.32;
const musicTime=10*60;
let percussionAt=5.5,detailAt=5.5,musicTravel=210;
function storyTime(elapsed){
 const t=elapsed-leadIn;
 if(t<percussionAt)return t;
 const afterTurn=Math.max(percussionAt,t-staticMusicTurn);
 if(afterTurn<=counterStart)return afterTurn;
 if(afterTurn<counterEnd+counterExtra)return counterStart+(afterTurn-counterStart)/2;
 return afterTurn-counterExtra;
}
function setWheelCue(selected){
 const travel=wrap(musicTime-selected,1440)||1440;
 musicTravel=Math.min(1439,travel);
 const fraction=musicTravel/1439;
 const progress=fraction<.5?Math.cbrt(fraction/4):1-Math.cbrt((1-fraction)/4);
 percussionAt=spinAt+(wordHandoffAt-spinAt)*progress;
 detailAt=Math.min(percussionAt,7.2);
}
const pullBackAt=counterEnd,wideRevealAt=wordHandoffAt+1;
let directDone=false;
let reelAnchor=390,lastFrameTime=-1,returnStart=null,sliderDrag=null,slidePosition=0;
const alarmTime=390;
const widePath="meadow-backgrounds/dawn-wide.png";
const tracks=["adinkra_audio-congas-and-woodblock-526722.mp3", "звуки пения птитц.mp3", "vibrotone-for-three-vibration-waves.mp3", "iphone_alarm.mp3", "3d-zvuk-atmosfera-derevni.mp3"].map(path=>{
 const media=new Audio(path);
 media.preload='auto';
 media.volume=0;
 return {media,active:false};
});
let pausedAt=null,muted=false,primed=false,widePhoto;
const reveal=(id,value)=>{el(id).style.opacity=value};
const clamp01=x=>Math.min(1,Math.max(0,x));
function prepareLens(){
 const canvas=document.createElement('canvas');
 const size=279,rim=15,padding=12;
 const field=document.createElement('canvas');
 const paddedSize=size+2*padding,center=(paddedSize-1)/2,radius=(size-1)/2;
 field.width=field.height=paddedSize;
 canvas.width=canvas.height=size;
 const fieldCtx=field.getContext('2d');
 const map=fieldCtx.createImageData(paddedSize,paddedSize);
 for(let y=0;y<paddedSize;y++)for(let x=0;x<paddedSize;x++){
  const dx=(x-center)/radius,dy=(y-center)/radius,r=Math.hypot(dx,dy);
  const displacement=125*ease((r*radius-(radius-rim))/rim);
  const i=(y*paddedSize+x)*4;
  map.data[i]=Math.round(128-dx/Math.max(1,r)*displacement);
  map.data[i+1]=Math.round(128-dy/Math.max(1,r)*displacement);
  map.data[i+2]=128;
  map.data[i+3]=255;
 }
 fieldCtx.putImageData(map,0,0);
 const ctx=canvas.getContext('2d');
 ctx.filter='blur(3px)';
 ctx.drawImage(field,-padding,-padding);
 el('lens-map').setAttribute('href',canvas.toDataURL());
 // Chromium supports SVG URL backdrop filters; use the layered lens elsewhere.
 if(/Chrome\//.test(navigator.userAgent)&&CSS.supports('backdrop-filter','url(#liquid-glass-lens)')){
  el('lens').classList.add('native');
 }
}
const fit=()=>Math.min(innerWidth*.90/393,innerHeight*.84/852);

 el('alarm-screen').inert=!canSlide;
 el('alarm-screen').style.pointerEvents=canSlide?'auto':'none';
 el('alarm-screen').style.filter='blur('+((1-alarm)*12)+'px)';
 el('alarm-card').style.setProperty('--phone-scale',fit());
 el('alarm-card').style.translate=(Math.sin(t*76)*alarm*1.8)+'px 0';
 const slider=el('alarm-track');
 const position=sliderDrag||returnStart!==null?slidePosition:Math.max(slidePosition,cubicPhase(t,autoSlide,returnAt));
 el('alarm-thumb').style.transform='translateX('+((slider.clientWidth-98)*position)+'px)';
 slider.style.setProperty('--label-hide',cubicPhase(position,.42,.83));
 cue(tracks[0],musicClock,percussionAt,percussionAt+percussionCut,.73*cubicPhase(musicClock,percussionAt,percussionAt+.25));
 cue(tracks[1],t,12,impactAt,.63*cubicPhase(t,12,17));
 cue(tracks[4],t,12,impactAt,.34*cubicPhase(t,12,13.5),1.1);
 cue(tracks[2],t,vibrationAt,vibrationEnd,.34);
 cue(tracks[3],t,ringAt,returning+.3,.72*(1-cubicPhase(t,returning,returning+.3)));
 lastFrameTime=t;
 if(t>=returning+1.3){
  stop();
  reveal('phone',0);
  paintList(1);
  return;
 }
 animationId=requestAnimationFrame(frame);
}
const slide=el('alarm-track');
function finishAlarm(){
 if(start===null||returnStart!==null)return;
 returnStart=storyTime(reelElapsed(performance.now()));
 slidePosition=1;
 sliderDrag=null;
}
slide.onpointerdown=e=>{
 if(start===null||e.button!==0)return;
 sliderDrag={id:e.pointerId,x:e.clientX,base:slidePosition};
 slide.setPointerCapture(e.pointerId);
};
slide.onpointermove=e=>{
 if(sliderDrag?.id!==e.pointerId)return;
 slidePosition=clamp01(sliderDrag.base+(e.clientX-sliderDrag.x)/((slide.clientWidth-98)*fit()));
 if(slidePosition>.87)finishAlarm();
};
slide.onlostpointercapture=()=>{sliderDrag=null};
slide.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();finishAlarm()}};
el('snooze').onclick=finishAlarm;

function restartReel(selected=alarmTime,clicked=false){
 if(!ready)return;
 unlock();
 stop();
 setIdleGlow(false);
 // Done confirms once per run. Pausing keeps it locked; stopping resets it.
 el('done').disabled=true;
 primeTracks();
 reelAnchor=saved=selected;
 setWakeAssets(selected);
 setWheelCue(selected);
 returnStart=sliderDrag=null;
 slidePosition=0;lastFrameTime=-Infinity;
 directDone=clicked;
 leadIn=clicked?0:introLength;
 onboarding=false;
 if(clicked){saveListAlarm(selected);tone(660,.12,.055);}
 show(selected,false,false,selected===alarmTime?360:selected);
 setPlay('Pause');
 document.documentElement.style.setProperty('--play-state','running');
 start=performance.now();
 frame(start);
}
function toggleReel(){
 if(!ready)return;
 if(start!==null){
  pausedAt=reelElapsed(performance.now());
  start=null;
  cancelAnimationFrame(animationId);
  for(const {media} of tracks) media.pause();
  document.documentElement.style.setProperty('--play-state','paused');
  setPlay('Resume');
 }else if(pausedAt===0){restartReel(reelAnchor)}
 else if(pausedAt!==null){
  start=performance.now()-pausedAt*1000;
  pausedAt=null;
  for(const track of tracks)if(track.active)track.media.play().catch(()=>{});
  document.documentElement.style.setProperty('--play-state','running');
  setPlay('Pause');
  frame(performance.now());
 }else restartReel();
}
el('play').onclick=toggleReel;
el('restart').onclick=()=>restartReel();
el('mute').onclick=()=>{
 muted=!muted;
 for(const {media} of tracks)media.muted=muted;
 setMute();
 el('mute').setAttribute('aria-pressed',muted);
};
function angle(e){const r=el('dial').getBoundingClientRect();return Math.atan2(e.clientX-r.left-r.width/2,r.top+r.height/2-e.clientY)*180/Math.PI}
const dial=el('dial');
dial.onpointerdown=e=>{if(!ready||drag||el('done').disabled||e.button!==0)return;unlock();onboarding=false;stop();dial.setPointerCapture(e.pointerId);const a=angle(e);
 const offset=wrap(a-time*.5+180,360)-180;drag={id:e.pointerId,a,value:time+offset*2,stamp:e.timeStamp};show(drag.value,false)};
dial.onpointermove=e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const a=angle(e),delta=2*(wrap(a-drag.a+180,360)-180);
 const speed=Math.abs(delta)/Math.max(1,e.timeStamp-drag.stamp);
 drag.value+=delta;
 drag.a=a;
 drag.stamp=e.timeStamp;
 show(magneticTime(drag.value,speed),true,true);
};
dial.onlostpointercapture=()=>drag=null;
window.onkeydown=e=>{if(!ready)return;
 if(e.code==='KeyS'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.repeat){
  const panel=el('reel-controls');
  panel.hidden=!panel.hidden;
  return;
 }
 if(e.code==='Space'&&!(e.target instanceof HTMLButtonElement)){e.preventDefault();if(!e.repeat)toggleReel()}
 else if(e.key==='Escape'){stop();show(saved)}
 else if(!el('done').disabled&&document.activeElement===dial&&['ArrowLeft','ArrowDown','ArrowUp','ArrowRight'].includes(e.key)){e.preventDefault();unlock();onboarding=false;stop();show(time+(['ArrowRight','ArrowUp'].includes(e.key)?1:-1),true,true)}};
el('cancel').onclick=()=>{
 if(!ready)return;
 onboarding=true;
 stop();
 saved=reelAnchor;
 returnStart=sliderDrag=null;
 slidePosition=0;lastFrameTime=-1;
 show(reelAnchor,false,false,reelAnchor===alarmTime?360:reelAnchor);
 pausedAt=0;
 paintList(1);
 setPlay('Resume');
};
el('done').onclick=()=>{if(ready&&!el('done').disabled)restartReel(time,true)};
prepareLens();
setPlay('Play');setMute();setControl('restart','Restart','restart');
window.onresize=()=>{if(start!==null)return;if(pausedAt>0){const now=performance.now();start=now-pausedAt*1000;frame(now);cancelAnimationFrame(animationId);start=null;}else{layout();detailCamera(0);el('alarm-list').style.setProperty('--list-scale',fit())}};layout();el('ui').hidden=true;
(async()=>{try{[backgrounds,words,yellowWords]=await Promise.all([sequence(24,i=>loadImage('meadow-backgrounds/'+String(i).padStart(2,'0')+'-00.png')),sequence(60,i=>loadImage('fonts-svg/EN/'+numberToSlug(i)+'.svg')),sequence(60,i=>loadImage('Yellow fonts/'+numberToSlug(i)+'.svg'))]);widePhoto=await loadImage(widePath).catch(error=>{
  console.warn('Wide dawn background failed; using the 06:00 frame.',error);
  return backgrounds[6];
 });
 setWakeAssets(alarmTime);

 for(const [x,y,size,opacity] of [[0,17,12,.65],[26,8,15,.78],[45,24,10,.56],[75,15,12,.67],[99,2,15,.76],[126,11,13,.7]]){
  const bird=new Image();
  bird.src='dawn-starling.webp';
  Object.assign(bird.style,{left:x+'px',top:y+'px',width:size+'px',opacity});
  el('birds').append(bird);
 }
 el('dawn-hour').src=words[6].src;
 saved=alarmTime;show(alarmTime,false,false,360);ready=true;renderAlarms();paintList(0);setIdleGlow(true);el('status').hidden=true;el('ui').hidden=false}catch{el('status').textContent='Could not load local alarm assets.'}})();
